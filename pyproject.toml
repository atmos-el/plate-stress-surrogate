[project]
name = "plate-stress-surrogate"
version = "0.1.0"
description = "Chapter 2 demo: 2D plate static analysis, dataset generation, and surrogate modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gmsh>=4.14.1",
  "matplotlib>=3.10.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "scikit-learn>=1.7.0",
  "torch>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plate_demo"]

[tool.uv]
package = true
